name: CI

on:
  push:
    branches: [public, codex/development, codex/testing]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: TypeScript e interface web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck e validações locais (sem provedores ou acervos pessoais)
        run: npm test
      - name: Build da interface web
        run: npm run build

  python:
    name: Discord bot (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discordbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Suíte de testes
        run: python -m unittest discover -s tests -v
