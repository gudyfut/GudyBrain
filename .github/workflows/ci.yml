name: CI

on:
  push:
    branches: [public, main]
  pull_request:

jobs:
  node:
    name: TypeScript e interface web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar bundle de memória de demonstração
        run: npm run memory:init

      - name: Typecheck e validações locais
        run: npm test

      - name: Build da interface web
        run: npm run build

  python:
    name: Discord bot (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discordbot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Suíte de testes
        run: python -m unittest discover -s tests -v
